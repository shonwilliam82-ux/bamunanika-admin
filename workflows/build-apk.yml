
name: Build BAMUNANIKA COMMAND V19.2 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'build-v19-2-android-apk.yml'
      - 'BAMUNANIKA_COMMAND_V19_2_GITHUB_READY.zip'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check V19.2 source ZIP
        run: |
          if [ ! -f BAMUNANIKA_COMMAND_V19_2_GITHUB_READY.zip ]; then
            echo "ERROR: V19.2 source ZIP is missing."
            echo "Upload BAMUNANIKA_COMMAND_V19_2_GITHUB_READY.zip to the repository root."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract V19.2 source
        run: |
          mkdir source
          unzip -q BAMUNANIKA_COMMAND_V19_2_GITHUB_READY.zip -d source
          find source -type f | head -100
          HTML=$(find source -type f \( -iname 'index.html' \) | head -1)
          if [ -z "$HTML" ]; then
            echo "ERROR: index.html not found in ZIP"
            exit 1
          fi
          mkdir -p app/src/main/assets
          cp "$HTML" app/src/main/assets/index.html
          cp -r "$(dirname "$HTML")"/. app/src/main/assets/ || true

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/bamunanika/command
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BamunanikaCommand"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bamunanika.command'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.bamunanika.command'
                  minSdk 23
                  targetSdk 35
                  versionCode 192
                  versionName '19.2'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="BAMUNANIKA COMMAND V19.2"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/bamunanika/command/MainActivity.java <<'EOF'
          package com.bamunanika.command;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import android.webkit.PermissionRequest;
          import android.webkit.WebViewClient;
          import android.webkit.GeolocationPermissions;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setGeolocationEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(request::grant);
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                          String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BAMUNANIKA-COMMAND-V19.2-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
