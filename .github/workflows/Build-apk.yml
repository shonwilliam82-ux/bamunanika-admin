name: Build Bamunanika Admin APK



on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bamunanika-admin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          archive="BamunanikaAdmin_VERIFIED_SOURCE-1.zip"

          if [ ! -f "$archive" ]; then
            echo "::error::Source ZIP not found: $archive"
            exit 1
          fi

          mkdir -p project
          unzip -oq "$archive" -d project

          project_dir="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"

          if [ -z "$project_dir" ]; then
            echo "::error::No Android Gradle project found in the ZIP archive."
            echo "ZIP contents:"
            unzip -l "$archive"
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Project found at: $project_dir"

      - name: Set up Java 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"

          gradle --no-daemon --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Bamunanika-Admin-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
