
      - name: Extract and locate V9 Android project
        id: locate
        run: |
          mkdir -p v9-android
          unzip -q BAMUNANIKA_V9_ANDROID_READY.zip -d v9-android

          echo "Files extracted from ZIP:"
          find v9-android -maxdepth 6 -type f | head -100

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/v9-android" -name settings.gradle -type f -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found in the ZIP."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]; then
            echo "ERROR: Dashboard index.html was not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
