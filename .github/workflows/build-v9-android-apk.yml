
name: Build BAMUNANIKA V9 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BAMUNANIKA_V9_ANDROID_READY.zip'
      - '.github/workflows/build-v9-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract V9 Android project
        run: |
          test -f BAMUNANIKA_V9_ANDROID_READY.zip
          mkdir -p v9-android
          unzip -q BAMUNANIKA_V9_ANDROID_READY.zip -d v9-android
          test -f v9-android/BAMUNANIKA_V9_ANDROID_READY/settings.gradle
          test -f v9-android/BAMUNANIKA_V9_ANDROID_READY/app/src/main/assets/index.html

      - name: Build V9 debug APK
        working-directory: v9-android/BAMUNANIKA_V9_ANDROID_READY
        run: gradle --no-daemon assembleDebug

      - name: Upload V9 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BAMUNANIKA-V9-Android-APK
          path: v9-android/BAMUNANIKA_V9_ANDROID_READY/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
