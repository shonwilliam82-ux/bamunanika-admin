
name: Build BAMUNANIKA V9 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Check ZIP exists
        run: |
          ls -lah
          test -f BAMUNANIKA_V9_ANDROID_READY.zip

      - name: Extract and locate V9 project
        id: locate
        run: |
          mkdir -p v9-android
          unzip -q BAMUNANIKA_V9_ANDROID_READY.zip -d v9-android
          find v9-android -name settings.gradle -type f
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/v9-android" -name settings.gradle -type f -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build V9 debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload V9 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BAMUNANIKA-V9-Android-APK
          path: v9-android/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
