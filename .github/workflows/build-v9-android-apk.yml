name: Build BAMUNANIKA V9 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BAMUNANIKA_V9_ANDROID_READY.zip'
      - '.github/workflows/build-v9-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract isolated V9 Android project
        run: |
          test -f BAMUNANIKA_V9_ANDROID_READY.zip
          mkdir -p v9-android
          unzip -q BAMUNANIKA_V9_ANDROID_READY.zip -d v9-android
          test -f v9-android/BAMUNANIKA_V9_ANDROID_READY/settings.gradle
          test -f v9-android/BAMUNANIKA_V9_ANDROID_READY/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V9 debug APK
        working-directory: v9-android/BAMUNANIKA_V9_ANDROID_READY
        run: gradle --no-daemon assembleDebug

      - name: Upload V9 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BAMUNANIKA-V9-Android-APK
          path: v9-android/BAMUNANIKA_V9_ANDROID_READY/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
