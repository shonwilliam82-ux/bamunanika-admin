
name: Build BAMUNANIKA COMMAND V19.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        run: |
          set -e
          mkdir -p source
          if [ ! -f gradlew ]; then
            ZIP=$(find . -maxdepth 2 -iname '*.zip' -print -quit)
            if [ -z "$ZIP" ]; then
              echo "No Android Gradle project or ZIP found."
              exit 1
            fi
            unzip -q "$ZIP" -d source
          fi

          GRADLEW=$(find . -type f -name gradlew -not -path './.git/*' -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "Android Gradle wrapper is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build V19.2 Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BAMUNANIKA-COMMAND-V19.2-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
